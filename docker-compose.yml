name: biletflow

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: biletflow
      POSTGRES_USER: biletflow_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biletflow_owner -d biletflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://biletflow_owner:${POSTGRES_PASSWORD}@db:5432/biletflow
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    command: ["python", "-m", "app.bootstrap"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://biletflow_app:${APP_DB_PASSWORD}@db:5432/biletflow
      SMTP_HOST: mailpit
      # Trust Caddy's X-Forwarded-For so per-address rate limits see the real client.
      # Port 8000 is published on localhost only, so nobody outside can forge this header.
      FORWARDED_ALLOW_IPS: "*"
      # Object storage (#77): see the storage services below.
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://storage:9000
      MINIO_ROOT_USER: ""
      MINIO_ROOT_PASSWORD: ""
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://biletflow_app:${APP_DB_PASSWORD}@db:5432/biletflow
      SMTP_HOST: mailpit
      # Object storage (#77): the same bucket and account as api.
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://storage:9000
      MINIO_ROOT_USER: ""
      MINIO_ROOT_PASSWORD: ""
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/biletflow-worker-heartbeat') > 120)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  # --- Object storage (#77) ---------------------------------------------------------------
  # Private S3-compatible storage for event images, ticket PDFs and support attachments, shared
  # by api and worker. Not published on the host. The root account (MINIO_ROOT_*) is used only
  # here and by storage-init; api and worker get the bucket-scoped app account (S3_*).
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - object_storage:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Provisions the private bucket and the app account, then exits. Idempotent: it runs on every
  # `docker compose up`, and api/worker start only after it succeeded. The app account may only
  # list the bucket and read, write and delete its objects (listing makes a missing object a
  # 404 rather than a 403, and lets tools/backup.sh archive the bucket).
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set biletflow http://storage:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "biletflow/$$S3_BUCKET"
        mc anonymous set none "biletflow/$$S3_BUCKET"
        printf '%s' '{"Version":"2012-10-17","Statement":[
          {"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::'"$$S3_BUCKET"'"]},
          {"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],
           "Resource":["arn:aws:s3:::'"$$S3_BUCKET"'/*"]}]}' >/tmp/policy.json
        mc admin policy create biletflow biletflow-bucket-rw /tmp/policy.json
        mc admin user add biletflow "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" >/dev/null ||
          mc admin user info biletflow "$$S3_ACCESS_KEY_ID" >/dev/null
        # Attaching an already attached policy fails, so the result is checked afterwards: the
        # account's PolicyName line must name the policy, or provisioning fails.
        mc admin policy attach biletflow biletflow-bucket-rw --user "$$S3_ACCESS_KEY_ID" || true
        attached=no
        while IFS= read -r line; do
          case "$$line" in
            *PolicyName:*biletflow-bucket-rw*) attached=yes ;;
          esac
        done <<EOF
        $$(mc admin user info biletflow "$$S3_ACCESS_KEY_ID")
        EOF
        if [ "$$attached" != yes ]; then
          echo "Policy biletflow-bucket-rw is not attached to $$S3_ACCESS_KEY_ID." >&2
          exit 1
        fi
        echo "Bucket $$S3_BUCKET and its app account are ready."
    depends_on:
      storage:
        condition: service_healthy
    restart: "no"
  # --- End of object storage ----------------------------------------------------------------

  proxy:
    restart: unless-stopped
    build:
      context: .
      dockerfile: proxy/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  object_storage:
