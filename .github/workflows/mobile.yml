name: Mobile app
# The app copies the web catalogs and src/i18n/catalogs.test.ts compares them
# with web/src/i18n/locales, so a web-only catalog change must run this too.
on:
  push:
    paths: ["mobile/**", "web/src/i18n/locales/**", "web/translations/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", "web/src/i18n/locales/**", "web/translations/**", ".github/workflows/mobile.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
