name: Web

on:
  push:
    paths:
      - "web/**"
      - "e2e/layout/**"
      - "e2e/layout.config.ts"
      - "e2e/package.json"
      - "e2e/package-lock.json"
      - "e2e/tsconfig.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "e2e/layout/**"
      - "e2e/layout.config.ts"
      - "e2e/package.json"
      - "e2e/package-lock.json"
      - "e2e/tsconfig.json"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # jsdom 30 and its deps require Node ^22.22.2; don't rely on an older cached 22.x.
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  # Layout checks: the web app in Chromium at phone, tablet and desktop widths in
  # English, Russian and Kazakh, with the API answered by fixtures (no backend).
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run test:layout
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: layout-test-results
          path: e2e/test-results
          if-no-files-found: ignore
