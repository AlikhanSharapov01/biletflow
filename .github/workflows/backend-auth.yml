name: Backend API
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biletflow_auth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d biletflow_auth_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/biletflow_auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check app tests migrations
      - run: uv run ruff format --check app tests migrations
      - run: uv run pytest -q --cov=app --cov-report=term-missing
