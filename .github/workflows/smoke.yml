name: Smoke

on:
  push:
    paths:
      - "backend/**"
      - "web/**"
      - "proxy/**"
      - "tools/smoke_*.py"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/smoke.yml"
  pull_request:
    paths:
      - "backend/**"
      - "web/**"
      - "proxy/**"
      - "tools/smoke_*.py"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/smoke.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
      - run: cp .env.example .env
      # Returns once the proxy has started, which itself waits for a healthy API.
      - run: docker compose up -d --build
      - name: Wait for a healthy worker
        run: |
          worker="$(docker compose ps -q worker)"
          timeout 120 sh -c "until [ \"\$(docker inspect -f '{{.State.Health.Status}}' $worker)\" = healthy ]; do sleep 2; done"
      - run: uv sync --frozen --python 3.12
        working-directory: backend
      - run: uv run python ../tools/smoke_admission.py
        working-directory: backend
      - run: uv run python ../tools/smoke_paid_checkout.py
        working-directory: backend
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
