name: E2E

# Browser tests (Playwright) against the real Docker Compose stack. They sit next to the API
# smoke tests in smoke.yml: those call the API, these drive the web app in a browser.

on:
  push:
    paths:
      - "e2e/**"
      - "backend/**"
      - "web/**"
      - "proxy/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "e2e/**"
      - "backend/**"
      - "web/**"
      - "proxy/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      # Returns once the proxy has started, which itself waits for a healthy API.
      - run: docker compose up -d --build
      - name: Wait for a healthy worker
        run: |
          worker="$(docker compose ps -q worker)"
          timeout 120 sh -c "until [ \"\$(docker inspect -f '{{.State.Health.Status}}' $worker)\" = healthy ]; do sleep 2; done"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      # Traces, screenshots and the HTML report of failed tests: open a trace with
      # `npx playwright show-trace <file>.zip`.
      - name: Save traces and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
